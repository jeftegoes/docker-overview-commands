# docker network create windows_net

services:
  jenkins:
    container_name: jenkins_dev
    image: jenkins/dotnet
    build:
      dockerfile: ./jenkins/Dockerfile
    ports:
      - 8080:8080
    volumes:
      - D:/DockerVolumes/jenkins_home:/var/jenkins_home
    networks:
      - windows_net
  rabbitmq:
    container_name: rabbitmq_dev
    image: rabbitmq:3.9-management
    ports:
      - 15672:15672
      - 5672:5672
    volumes:
      - D:/DockerVolumes/rabbitmq_home:/var/rabbitmq_home
    networks:
      - windows_net
  mssql: # Database
    container_name: mssql_dev
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=Master@123
      - ACCEPT_EULA=Y
    ports:
      - 1433:1433
    volumes:
      - D:/DockerVolumes/mssql_home:/var/mssql_home
    networks:
      - windows_net
  mysql: # Database
    container_name: mysql_dev
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Master@123
    ports:
      - 3306:3306
    networks:
      - windows_net
  seq:
    container_name: seq
    image: datalust/seq:latest
    ports:
      - 5341:80
    volumes:
      - D:/DockerVolumes/seq_home:/var/seq_home
    environment:
      - ACCEPT_EULA=Y
    networks:
      - windows_net
  # Modern Kafka does not need ZooKeeper.
  # zookeeper: 
  #   container_name: zookeeper_dev
  #   image: confluentinc/cp-zookeeper:latest
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #   ports:
  #     - 2181:2181
  #   networks: 
  #     - windows_net
  kafka:
    container_name: kafka_dev
    image: apache/kafka:latest
    environment:
# KRaft / Cluster Settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - 9092:9092
    networks: 
      - windows_net
  kafka-ui:
    container_name: kafka_ui_dev
    image: provectuslabs/kafka-ui:latest
    ports:
      - 7777:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks: 
      - windows_net
  grafana:
    container_name: grafana_dev
    image: grafana/grafana
    ports:
      - 3000:3000
    volumes:
      - D:/DockerVolumes/grafana_home:/var/lib/grafana
    networks:
      - windows_net
  prometheus:
    container_name: prometheus_dev
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - D:/DockerVolumes/prometheus_home:/etc/prometheus/
      # You need to place prometheus.yml file in the folder.
      - D:/DockerVolumes/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - windows_net
  graphite:
    container_name: graphite_dev
    image: hopsoft/graphite-statsd
    ports:
      - 81:81
      - 2003-2004:2003-2004
      - 2023-2024:2023-2024
      - 8125:8125/udp
      - 8126:8126
    networks:
      - windows_net
  glue_jupyter:
    container_name: glue_jupyter
    command: /home/glue_user/jupyter/jupyter_start.sh
    environment:
      - DISABLE_SSL=true
    image: amazon/aws-glue-libs:glue_libs_4.0.0_image_01
    ports:
      - 4040:4040
      - 18080:18080
      - 8998:8998
      - 8888:8888
    restart: always
    volumes:
      - D:/DockerVolumes/glue_jupyter:/home/glue_user/.aws
      - D:/DockerVolumes/glue_jupyter_workspace/:/home/glue_user/workspace/jupyter_workspace/
  mongodb: # Database
    container_name: mongo_dev
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: Master123456
    ports:
      - 27017:27017
    volumes:
      - D:/DockerVolumes/mongo_data:/data/db
    networks:
      - windows_net
  postgresql:
    container_name: postgresql_dev
    image: postgres
    ports:
      - 5432:5432
    restart: always
    environment:
      POSTGRES_PASSWORD: Master@123
    networks:
      - windows_net
  localstack:
    container_name: localstack_dev
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566'
      - '127.0.0.1:4510-4559:4510-4559'
      - '127.0.0.1:443:443'
    environment:
      # - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    networks:
      - windows_net
networks:
  windows_net:
    driver: bridge